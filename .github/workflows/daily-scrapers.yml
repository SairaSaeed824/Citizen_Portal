name: Daily Citizen Portal Scrapers

on:
  schedule:
    # 08:00 Pakistan Standard Time (UTC+5) every day
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NJP scraper
        run: python -m app.scrapers.njp_scraper

      - name: Run PMYP scraper
        run: python -m app.scrapers.pmyp_scraper

      - name: Run PSIC scraper
        run: python -m app.scrapers.psic_loan_scraper
