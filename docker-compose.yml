services:
  backend:
    build:
      context: ./backend
    container_name: citizen-portal-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: citizen-portal-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped